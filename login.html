<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1B3A6B"><title>Login — BanaoCV</title>
  <link rel="stylesheet" href="assets/css/style.css
  <link rel="stylesheet" href="assets/css/page-backgrounds.css" />"><link rel="stylesheet" href="assets/css/animations.css"><link rel="stylesheet" href="assets/css/mobile.css">
  <style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:100px 20px 40px;background:linear-gradient(135deg,#edf4ff,#fff8e9)}.auth-card{width:min(100%,440px);padding:36px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg)}.auth-card h1{margin:0 0 8px;color:var(--brand-dark)}.auth-card p{color:var(--text-3);margin-bottom:25px}.auth-card .form-group{margin:14px 0}.auth-switch{text-align:center;margin:18px 0 0;font-size:.9rem}.auth-switch a{color:var(--brand);font-weight:700;cursor:pointer}</style>
  <script src="assets/js/config.runtime.js"></script>
</head>
<body class="bg-login"><div class="page-bg-animated"></div><script src="components/nav.js"></script>
<main class="auth-page"><section class="auth-card"><div id="login-view"><span class="eyebrow">WELCOME BACK</span><h1>Login karo</h1><p>Apne resumes aur downloads access karo.</p><div class="form-group"><label class="form-label">Email</label><input id="login-email" class="form-input" type="email" placeholder="name@email.com"></div><div class="form-group"><label class="form-label">Password</label><input id="login-password" class="form-input" type="password" placeholder="Password"></div><button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="RW.Auth.emailLogin()">Login Karo</button><button class="btn btn-ghost btn-lg" style="width:100%;justify-content:center;margin-top:10px" onclick="RW.Auth.googleLogin()">Google se continue karo</button><p class="auth-switch">Naye ho? <a onclick="toggleAuth()">Free account banao</a></p></div><div id="signup-view" style="display:none"><span class="eyebrow">START FREE</span><h1>Account banao</h1><p>2 minute mein professional resume ready.</p><div class="form-group"><label class="form-label">Naam</label><input id="signup-name" class="form-input" placeholder="Aapka naam"></div><div class="form-group"><label class="form-label">Email</label><input id="signup-email" class="form-input" type="email" placeholder="name@email.com"></div><div class="form-group"><label class="form-label">Password</label><input id="signup-password" class="form-input" type="password" placeholder="Password"></div><button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="RW.Auth.emailSignup()">Free account banao</button><p class="auth-switch">Pehle se account hai? <a onclick="toggleAuth()">Login karo</a></p></div></section></main>
<script src="assets/js/main.js"></script><script>function toggleAuth(){document.getElementById('login-view').style.display=document.getElementById('login-view').style.display==='none'?'block':'none';document.getElementById('signup-view').style.display=document.getElementById('signup-view').style.display==='none'?'block':'none'}</script></body></html>
